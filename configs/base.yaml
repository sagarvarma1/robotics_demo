# Base experiment config. Other configs say `base: base.yaml` and override keys.
name: base
seed: 0
env:
  motion_path: data/motions/cmu_16_35.npz
  ctrl_dt: 0.02
  sim_dt: 0.005
  episode_length: 500          # policy steps (10 s)
  reward:                      # DeepMimic (Peng et al. 2018) weights and scales as the starting point
    weights: {pose: 0.65, vel: 0.10, ee: 0.15, com: 0.10}
    scales:  {pose: 2.0,  vel: 0.1,  ee: 40.0, com: 10.0}
  pd: {kp_scale: 1.0, kd_scale: 1.0}
  termination:
    max_root_drift: 0.5        # m, distance between sim and reference root
train:
  algo: brax_ppo
  num_timesteps: 200_000_000
  num_envs: 2048
  batch_size: 1024
  unroll_length: 20
  num_minibatches: 32
  num_updates_per_batch: 4
  discounting: 0.95
  learning_rate: 3.0e-4
  entropy_cost: 1.0e-3
  reward_scaling: 1.0
  normalize_observations: true
  num_evals: 20
